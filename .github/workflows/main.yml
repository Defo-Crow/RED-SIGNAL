name: Build RED SIGNAL VST3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 / VST3
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          git --version

      - name: Configure project
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_BUILD_EXAMPLES=OFF
          -DJUCE_BUILD_EXTRAS=OFF

      - name: Build VST3
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Package plugin bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\RedSignal_artefacts\Release\VST3\RED SIGNAL.vst3'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) {
            Write-Error "VST3 bundle not found at: $bundle"
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'build\RedSignal_artefacts') -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            exit 1
          }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $dist -Recurse -Force

          $zip = Join-Path $dist 'RED-SIGNAL-Windows-x64-VST3.zip'
          Compress-Archive -LiteralPath (Join-Path $dist 'RED SIGNAL.vst3') -DestinationPath $zip -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          @"
          RED SIGNAL - Windows x64 VST3
          Commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_RUN_NUMBER
          SHA256: $hash

          The ZIP contains the complete 'RED SIGNAL.vst3' bundle.
          Install the entire bundle folder; do not extract or copy only the internal binary.
          "@ | Set-Content -LiteralPath (Join-Path $dist 'BUILD-INFO.txt') -Encoding utf8

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: RED-SIGNAL-Windows-x64-VST3
          path: |
            dist/RED-SIGNAL-Windows-x64-VST3.zip
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
